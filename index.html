<!DOCTYPE html>
<html>
<head>
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova AI</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .status {
      text-align: center;
      margin-bottom: 20px;
    }

    #chat {
      height: 55vh;
      overflow-y: auto;
      background: #1b1b1b;
      border-radius: 15px;
      padding: 15px;
    }

    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .you {
      background: #333;
      text-align: right;
    }

    .nova {
      background: #242424;
    }

    .inputArea {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 14px 16px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    #micButton {
      width: 100%;
      margin-top: 10px;
    }

    #micButton.listening {
      background: #d33;
      color: white;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>🤖 Nova</h1>
  <div class="status">● Online</div>

  <div id="chat">
    <div class="message nova">
      Nova: Hello sir, how can I help you today?
    </div>
  </div>

  <div class="inputArea">
    <input id="message"
           type="text"
           placeholder="Talk to Nova, sir..."
           onkeydown="if(event.key === 'Enter') sendMessage()">

    <button onclick="sendMessage()">Send</button>
  </div>

  <button id="micButton" onclick="startListening()">
    🎤 Tap to speak
  </button>

</div>

<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby235s0Ig5i9LDtkGB17EuQUpHlyf61nwfNyj8OXE4Hci156VT6zdHbSdSJDvbQzlAZUA/exec";


let recognition = null;

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function() {

    const button =
      document.getElementById("micButton");

    button.textContent = "🔴 Listening...";
    button.classList.add("listening");
  };

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    document.getElementById("message").value = text;

    sendMessage();
  };

  recognition.onerror = function(event) {

    alert("Microphone error: " + event.error);
  };

  recognition.onend = function() {

    const button =
      document.getElementById("micButton");

    button.textContent = "🎤 Tap to speak";
    button.classList.remove("listening");
  };
}


function startListening() {

  if (!recognition) {

    alert(
      "Voice recognition is not supported by this browser."
    );

    return;
  }

  recognition.start();
}


function addMessage(text, type) {

  const chat =
    document.getElementById("chat");

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;
}


function speak(text) {

  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const voices =
    speechSynthesis.getVoices();

  const preferredVoice =
    voices.find(v =>
      v.lang.startsWith("en") &&
      /female|zira|samantha|google uk english female/i.test(v.name)
    ) ||
    voices.find(v =>
      v.lang.startsWith("en")
    );

  const utterance =
    new SpeechSynthesisUtterance(text);

  if (preferredVoice) {
    utterance.voice = preferredVoice;
  }

  utterance.lang = "en-IN";
  utterance.rate = 0.92;
  utterance.pitch = 0.85;
  utterance.volume = 1;

  speechSynthesis.speak(utterance);
}


function sendMessage() {

  const input =
    document.getElementById("message");

  const message =
    input.value.trim();

  if (!message) return;

  addMessage(
    "You: " + message,
    "you"
  );

  input.value = "";

  const thinking =
    document.createElement("div");

  thinking.className =
    "message nova";

  thinking.textContent =
    "Nova: Thinking...";

  document.getElementById("chat")
    .appendChild(thinking);


  const callbackName =
    "novaCallback_" + Date.now();


  window[callbackName] =
    function(data) {

      if (data.success) {

        thinking.textContent =
          "Nova: " + data.reply;

        speak(data.reply);

      } else {

        thinking.textContent =
          "Nova: Sorry, sir. " +
          (data.error || "Something went wrong.");
      }

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    };


  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?action=ask" +
    "&message=" +
    encodeURIComponent(message) +
    "&callback=" +
    callbackName;


  script.onerror = function() {

    thinking.textContent =
      "Nova: Sorry, sir. I couldn't connect.";

    delete window[callbackName];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }
  };


  document.body.appendChild(script);
}

</script>

</body>
</html>
